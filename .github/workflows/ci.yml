name: Barq Assessment CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax checks
        run: |
          python -m compileall -q app tests failure_test.py

      - name: Compose syntax check
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build application images
        run: |
          docker compose build

      - name: Start stack
        run: |
          docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if docker compose ps | grep -q "healthy"; then
              if docker compose exec -T app-01 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)" >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run validation
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
